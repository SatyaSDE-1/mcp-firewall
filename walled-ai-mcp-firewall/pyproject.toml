[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-firewall"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "python-socketio>=5.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-firewall = "mcp_firewall.main:main"
mcp-firewall-wrapper = "mcp_firewall.wrapper:main"

[tool.setuptools.packages.find]
where = ["src"]
