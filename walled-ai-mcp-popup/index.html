<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
  <style>
    body { font: 14px -apple-system, sans-serif; margin: 0; padding: 18px;
           background: #1e1e22; color: #eee; user-select: none; }
    header { display: flex; justify-content: space-between; align-items: center;
             -webkit-app-region: drag; margin-bottom: 12px; }
    h1 { font-size: 16px; margin: 0; }
    #pending { color: #f0b429; font-size: 12px; }
    .row { display: flex; padding: 3px 0; }
    .row b { width: 70px; color: #9aa; font-weight: 500; }
    pre { background: #111; border-radius: 6px; padding: 10px; height: 190px;
          overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all;
          user-select: text; }
    .buttons { display: flex; gap: 10px; margin-top: 12px; }
    button { flex: 1; padding: 10px; font-size: 14px; border: 0; border-radius: 6px;
             cursor: pointer; color: #fff; }
    #block { background: #c0392b; }
    #allow { background: #2e8b57; }
    button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header><h1>MCP request waiting</h1><span id="pending"></span></header>
  <div class="row"><b>Source</b><span id="source"></span></div>
  <div class="row"><b>Server</b><span id="server"></span></div>
  <div class="row"><b>Method</b><span id="method"></span></div>
  <div class="row"><b>Tool</b><span id="tool"></span></div>
  <pre id="params"></pre>
  <div class="buttons">
    <button id="block">Block (Esc)</button>
    <button id="allow" disabled>Allow</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
